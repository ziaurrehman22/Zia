<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You For Your Order | ZIA</title>
    <meta name="description"
        content="Thank you for shopping with ZIA Clothing. Your order has been successfully placed.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body style="text-align: center; padding: 80px 20px;">
    <main
        style="max-width: 600px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow);">
        <i class="fa-solid fa-circle-check" style="font-size: 60px; color: #27AE60; margin-bottom: 20px;"></i>
        <h1 style="color: var(--white); margin-bottom: 15px;">Order Placed Successfully!</h1>
        <p style="color: var(--muted); margin-bottom: 25px; line-height: 1.7;">
            Thank you for choosing ZIA Clothing. WhatsApp has been opened with your order details. Our team will verify
            and confirm your order shortly.
        </p>
        <a href="index.html" class="btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </main>
</body>

</html>
