
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FireBite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-logo">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-burger"></i> FireBite
                </a>
            </div>

            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Login to continue your food journey.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required
                           placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required
                           placeholder="Enter your password"
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn full-btn">Login Now</button>
                <p id="auth-message" class="message" role="status"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>
            <p class="auth-switch"><a href="index.html">← Back to Home</a></p>
        </section>
    </main>
</body>
</html>
