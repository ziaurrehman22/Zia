
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | FireBite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-logo">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-burger"></i> FireBite
                </a>
            </div>

            <h1>Create Account</h1>
            <p class="auth-subtitle">Join FireBite and discover great food.</p>

            <form id="signup-form">
                <div class="form-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" required
                           placeholder="Your name" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required
                           placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required
                           minlength="6" placeholder="At least 6 characters"
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn full-btn">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
                <p id="auth-message" class="message" role="status"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
            <p class="auth-switch"><a href="index.html">← Back to Home</a></p>
        </section>
    </main>
</body>
</html>
