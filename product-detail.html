<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ZIA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Logo">
        </a>

        <div class="nav-actions">
            <a href="cart.html" class="cart-link" style="font-family: sans-serif;">
                <p>View Cart</p>
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>

            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Detail Container -->
    <main class="product-detail-page section">
        <div id="product-detail-container" class="product-detail-container">
            <!-- Dynamic product content loaded via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Clothing Brand Logo">
        </a>

        <p>
            © 2026 ZIA. The Art of Dressing.
            Designed for those who define their own style.
        </p>
    </footer>

</body>

</html>
