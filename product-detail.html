<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ZIA</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Logo">
        </a>

        <button class="btn" id="open-camera-btn" type="button">
            <i class="fa-solid fa-camera"></i> Try with Live Camera
        </button>

        <div class="nav-actions">
            <a href="cart.html" class="cart-link" style="font-family: sans-serif;">
                <p>View Cart</p>
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>

            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Detail Container -->
    <main class="product-detail-page section">

        <!-- Live Camera Modal -->
        <div id="camera-modal"
            style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
            <div
                style="background: var(--card); padding: 20px; border-radius: 12px; max-width: 500px; width: 90%; text-align: center; position: relative; border: 1px solid var(--border);">
                <h3 style="color: var(--white); margin-bottom: 15px;">Live Virtual Mirror</h3>
                <div
                    style="position: relative; width: 100%; height: 350px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px;">
                    <video id="live-camera-feed" autoplay playsinline
                        style="width: 100%; height: 100%; object-fit: cover;"></video>
                </div>
                <div style="display: flex; justify-content: center; gap: 10px;">
                    <button id="close-camera-btn" class="btn"
                        style="background: var(--danger); border-color: var(--danger);">Close Camera</button>
                </div>
            </div>
        </div>
         
        <div id="product-detail-container" class="product-detail-container">
            <!-- Dynamic product content loaded via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Clothing Brand Logo">
        </a>

        <p>
            © 2026 ZIA. The Art of Dressing.
            Designed for those who define their own style.
        </p>
    </footer>

</body>

</html>
