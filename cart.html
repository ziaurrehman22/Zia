<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | ZIA</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="">
        </a>

        <!-- <nav>
        <a href="index.html">Home</a>
        <a href="#menu">Menu</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Signup</a>
    </nav> -->

        <a href="cart.html" class="cart-link" style="font-family: sans-serif;">
            View Cart
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </a>
    </header>

    <!-- Cart Page -->
    <main class="cart-page">

        <h1>
            <i class="fa-solid fa-bag-shopping"></i>
            Your Shopping Bag
        </h1>

        <p class="cart-subtitle">
            Review your selected styles before checkout.
        </p>

        <div class="cart-layout">

            <!-- Cart Items -->
            <section id="cart-items" class="cart-items" aria-label="Cart items">
            </section>

            <!-- Order Summary -->
            <aside class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs. 0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery Type</span>
                    <span>COD</span>
                </div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">Rs. 0</span>
                </div>

                <button class="btn full-btn" id="checkout-btn" type="button">

                    Proceed to Checkout
                    <i class="fa-solid fa-arrow-right"></i>

                </button>

                <p class="auth-switch">
                    <a href="index.html#collection">
                        <i class="fa-solid fa-arrow-left"></i>
                        Continue Shopping
                    </a>
                </p>

                <p id="checkout-message" class="message" role="status">
                </p>

            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Clothing Brand Logo">
        </a>

        <p>
            © 2026 ZIA. The Art of Dressing.
            Designed for those who define their own style.
        </p>
    </footer>

</body>

</html>
