<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Bag | ZIA Clothing</title>
    <meta name="description" content="Review your selected items and proceed securely to checkout with ZIA Clothing.">
    
    <meta property="og:title" content="Your Shopping Bag | ZIA Clothing">
    <meta property="og:description" content="Review your selected items and proceed securely to checkout.">
    <meta property="og:image" content="https://yourdomain.com/images/logo.png">
    <meta property="og:url" content="https://yourdomain.com/cart.html">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Logo">
        </a>
        <nav class="nav-links" style="display: flex; gap: 20px; align-items: center;">
            <a href="index.html">Home</a>
            <a href="faq.html">FAQ</a>
            <a href="privacy-policy.html">Privacy Policy</a>
        </nav>
        <div class="nav-actions">
            <a href="cart.html" class="cart-link" style="font-family: sans-serif;">
                <p>View Cart</p>
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Cart Page -->
    <main class="cart-page">
        <h1>
            <i class="fa-solid fa-bag-shopping"></i>
            Your Shopping Bag
        </h1>

        <p class="cart-subtitle">
            Review your selected styles before checkout.
        </p>

        <div class="cart-layout">
            <section id="cart-items" class="cart-items" aria-label="Cart items"></section>

            <aside class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs. 0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Type</span>
                    <span>COD</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">Rs. 0</span>
                </div>

                <button class="btn full-dir-btn full-btn" id="checkout-btn" type="button">
                    Proceed to Checkout via WhatsApp
                    <i class="fa-brands fa-whatsapp"></i>
                </button>

                <p class="auth-switch">
                    <a href="index.html#menu">
                        <i class="fa-solid fa-arrow-left" style="padding: 15px 0px 0px 30px;"></i>
                        Continue Shopping
                    </a>
                </p>
                <p id="checkout-message" class="message" role="status"></p>
            </aside>
        </div>
    </main>

    <footer>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Clothing Brand Logo">
        </a>
        <div style="display: flex; gap: 15px; margin: 10px 0;">
            <a href="index.html">Home</a> | <a href="faq.html">FAQ</a> | <a href="privacy-policy.html">Privacy Policy</a>
        </div>
        <p>© 2026 ZIA. The Art of Dressing.</p>
    </footer>
</body>
</html>
