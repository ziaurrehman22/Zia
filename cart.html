<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Bag | ZIA Clothing</title>
    <meta name="description" content="Review your selected items and proceed securely to checkout with ZIA Clothing.">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Logo">
        </a>
        
        <div class="nav-actions">
            <a href="cart.html" class="cart-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Bag</span>
                <span id="cart-count">0</span>
            </a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Cart Page Main -->
    <main class="cart-page">

        <!-- Order Progress Steps Bar -->
        <!-- <div class="checkout-steps">
            <div class="step active">
                <span class="step-num">1</span>
                <span class="step-label">Shopping Bag</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <span class="step-num">2</span>
                <span class="step-label">WhatsApp Order</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <span class="step-num">3</span>
                <span class="step-label">Confirmation</span>
            </div>
        </div> -->

        <div class="cart-header">
            <h1>Shopping Bag</h1>
            <p class="cart-subtitle">Review your selected pieces and customize size or quantity before placing order.
            </p>
        </div>

        <div class="cart-layout">
            <!-- Left Side: Dynamic Items List -->
            <section id="cart-items" class="cart-items" aria-label="Cart items"></section>

            <!-- Right Side: Detailed Summary Card inside cart.html -->
            <aside class="cart-summary">
                <h2>Order Summary</h2>

                <!-- Customer Details Form -->
                <div class="checkout-form" style="margin-bottom: 20px; display: grid; gap: 12px;">
                    <h4 style="font-size: 14px; color: var(--white); margin-bottom: -4px;">Shipping Details</h4>
                    <input type="text" id="customer-name" placeholder="Full Name *" required
                        style="padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--white); font-size: 13px;">
                    <input type="tel" id="customer-phone" placeholder="Phone Number (e.g. 03001234567) *" required
                        style="padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--white); font-size: 13px;">
                    <textarea id="customer-address" placeholder="Complete Delivery Address (House, Street, City) *"
                        rows="2" required
                        style="padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--white); font-size: 13px; resize: none;"></textarea>
                </div>

                <div class="summary-details">
                    <div class="summary-row">
                        <span>Items Subtotal</span>
                        <span id="subtotal">Rs. 0</span>
                    </div>
                    <div class="summary-row">
                        <span>Payment Method</span>
                        <span style="font-weight: 600; color: var(--white);">Cash On Delivery (COD)</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total Amount</span>
                        <span id="total">Rs. 0</span>
                    </div>
                </div>

                <button class="btn full-btn checkout-btn" id="checkout-btn" type="button">
                    <span>Confirm Order</span>
                    <!-- <i class="fa-brands fa-whatsapp"></i> -->
                </button>

                <button class="btn full-btn reset-cart-btn" id="reset-cart-btn" type="button"
                    style="background: var(--danger); border-color: var(--danger); margin-top: 10px;">
                    <span>Reset Cart</span>
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="ZIA Clothing Brand Logo">
        </a>
        <div style="display: flex; gap: 15px; margin: 10px 0;">
            <a href="index.html">Home</a> | <a href="faq.html">FAQ</a> | <a href="privacy-policy.html">Privacy
                Policy</a>
        </div>
        <p>© 2026 ZIA. The Art of Dressing.</p>
    </footer>

</body>

</html>
